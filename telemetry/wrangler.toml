# Scintle's usage-count collector (D26). Free plan; deploy with `npx wrangler deploy` from this folder.
name = "scintle-telemetry"
main = "src/worker.ts"
compatibility_date = "2026-11-01"
workers_dev = true

# No request logs: Workers Logs would capture headers, including the client IP.
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "scintle-telemetry"
database_id = "6e2ca6e1-fb1a-4744-a346-46d1b41b97a5"
migrations_dir = "migrations"
